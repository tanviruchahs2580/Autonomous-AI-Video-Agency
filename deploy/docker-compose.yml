services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      AGENCY_ENV: production
      AGENCY_API_KEY: ${AGENCY_API_KEY:?set AGENCY_API_KEY in .env}
      AGENCY_DB_URL: sqlite:////app/data/agency.db
      AGENCY_DATA_DIR: /app/data
      AGENCY_STORAGE_DIR: /app/data/storage
      AGENCY_RATE_LIMIT_PER_MIN: "120"
      AGENCY_APPROVAL_REQUIRED: ${AGENCY_APPROVAL_REQUIRED:-false}
    ports:
      - "8000:8000"
    volumes:
      - agency-data:/app/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "agency", "worker"]
    environment:
      AGENCY_ENV: production
      AGENCY_API_KEY: ${AGENCY_API_KEY:-worker-local}
      AGENCY_DB_URL: sqlite:////app/data/agency.db
      AGENCY_DATA_DIR: /app/data
      AGENCY_STORAGE_DIR: /app/data/storage
      AGENCY_TTS_PROVIDER: ${AGENCY_TTS_PROVIDER:-synth}
    volumes:
      - agency-data:/app/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6g
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["staging"]
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-staging}
      POSTGRES_DB: agency
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    profiles: ["staging"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agency}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-staging}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  agency-data:
  pg-data:
  minio-data:
